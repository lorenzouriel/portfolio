<div class="interest-group">
  {% if include.heading %}<h3 class="interest-group-title">{{ include.heading }}</h3>{% endif %}
  {% for post in include.items %}
    {% assign side = forloop.index0 | modulo: 2 %}
    {% if side == 0 %}
      {% include content-right.html %}
    {% else %}
      {% include content-left.html %}
    {% endif %}
  {% else %}
    <p class="interest-empty">{{ t.empty_list }}</p>
  {% endfor %}
</div>
