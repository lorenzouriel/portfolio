<div class="container">

  <div class="row">

    <div class="col-md-12">

      <div class="hero-container">

        <div class="hero-content">

          <img src="https://github.com/{{ site.github_username }}.png"
              alt="{{ site.github_username }} GitHub avatar"
              class="hero-avatar">
          <h1 class="text-center">{{ t.site_title }}</h1>

          <p class="text-center">
            {{ t.site_description }}

            {% if site.enable_contact == true %}
            {% include contact.html %}
            {% include contact-modal.html %}
            {% endif %}
          </p>


          <div class="hero-buttons">

            {% if site.substack_username != '' %}
              <a href="https://substack.com/@{{ site.substack_username }}" target="_blank"><button class="btn btn-default btn-lg"><i class="fa fa-rss fa-lg"></i>Substack</button></a>
            {% endif %}
            {% if site.medium_username != '' %}
              <a href="https://{{ site.medium_username }}" target="_blank"><button class="btn btn-default btn-lg"><i class="fa fa-medium fa-lg"></i>Medium</button></a>
            {% endif %}

          </div>

        </div>

      </div>

      <a class="section-jump text-center" href="#portfolio">
        <i class="fa fa-angle-down fa-3x"></i>
      </a>

    </div>

  </div>

</div>
