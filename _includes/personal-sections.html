{% assign section_names = 'writing,studying,reading' | split: ',' %}
{% for section_name in section_names %}
<section id="{{ section_name }}" class="portfolio-section" aria-labelledby="{{ section_name }}-title">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <h2 id="{{ section_name }}-title" class="section-title text-center">{{ t[section_name] }}</h2>
        <div class="break"></div>
        {% include interest-list.html items=site[section_name] %}
      </div>
    </div>
  </div>
</section>
{% endfor %}
