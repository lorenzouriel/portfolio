{% assign section_names = 'writing,studying,reading' | split: ',' %}
{% for section_name in section_names %}
<section id="{{ section_name }}" class="portfolio-section" aria-label="{{ t[section_name] | escape }}">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        {% assign section_items = site[section_name] %}
        {% include interest-list.html items=section_items %}
      </div>
    </div>
  </div>
</section>
{% endfor %}
