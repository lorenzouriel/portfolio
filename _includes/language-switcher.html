<div class="language-switcher">
  {% assign current_lang = page.lang | default: site.default_lang %}

  <a href="/"
     class="lang-link {% if current_lang == 'en' %}active{% endif %}"
     data-lang="en"
     title="English">
    EN
  </a>
  <span class="lang-separator">|</span>
  <a href="/pt"
     class="lang-link {% if current_lang == 'pt' %}active{% endif %}"
     data-lang="pt"
     title="Português">
    PT
  </a>
  <span class="lang-separator" aria-hidden="true">|</span>
  <button type="button" class="theme-toggle" hidden aria-pressed="false"
          aria-label="{% if current_lang == 'pt' %}Modo escuro{% else %}Dark mode{% endif %}"
          title="{% if current_lang == 'pt' %}Modo escuro{% else %}Dark mode{% endif %}">
    <i class="fa fa-moon-o" aria-hidden="true"></i>
  </button>
</div>
